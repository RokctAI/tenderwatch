name: tenderwatch

on:
  schedule:
    - cron: '0 6 * * 2'  # Tue 06:00 UTC (08:00 SAST): new tenders, after the opportunities archive sync at 02:00
    - cron: '0 6 * * 5'  # Fri 06:00 UTC (08:00 SAST): deadline reminders
  workflow_dispatch:
    inputs:
      mode:
        description: new or remind
        default: new
      dry_run:
        description: print instead of sending
        type: boolean
        default: true

permissions:
  contents: write

concurrency: tenderwatch

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          TENDER_EMAIL_TO: ${{ secrets.TENDER_EMAIL_TO }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "0 6 * * 5" ]; then MODE=remind; else MODE=new; fi
          fi
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          python -m tenderwatch.run "$MODE" $FLAGS
      - name: Save sent ledger
        run: |
          git config user.name "rokctbot[bot]"
          git config user.email "rokctbot@users.noreply.github.com"
          git add state/sent.json
          git diff --staged --quiet || { git commit -m "chore: update sent tenders [skip ci]"; git push; }
